name: lms_mobile
description: "LMS Gamified Learning Platform - Mobile (Flutter)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.6.2

  # Mock persistence (login session) -- tinggal swap ke flutter_secure_storage saat backend siap
  shared_preferences: ^2.3.3

  # Render materi markdown
  flutter_markdown: ^0.7.6

  # Format tanggal (id-ID)
  intl: ^0.20.2

  # Efek selebrasi level up
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
